suite: API Ingress
templates:
  - api/ingress.yaml
release:
  name: hearth
  namespace: default
tests:
  - it: should render when enabled (default)
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: hearth-hearth-home-api

  - it: should not render when disabled
    set:
      api.ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should set the correct host
    asserts:
      - equal:
          path: spec.rules[0].host
          value: "hearth.example.com"

  - it: should set the correct backend service
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: hearth-hearth-home-api
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.name
          value: http

  - it: should include TLS when configured
    set:
      api.ingress.tls:
        - hosts:
            - hearth.example.com
          secretName: hearth-tls
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: hearth-tls
      - contains:
          path: spec.tls[0].hosts
          content: hearth.example.com

  - it: should set ingressClassName when specified
    set:
      api.ingress.className: nginx
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: should include annotations when specified
    set:
      api.ingress.annotations:
        custom-annotation: test-value
    asserts:
      - equal:
          path: metadata.annotations.custom-annotation
          value: test-value

  # ------------------------------------------------------------------
  # H-006: cert-manager TLS auto-wiring (templates/_helpers.tpl)
  # ------------------------------------------------------------------
  - it: cert-manager off — no cert-manager annotation, tls preserved as-is
    set:
      certManager.enabled: false
    asserts:
      - notExists:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
      - notExists:
          path: spec.tls

  - it: cert-manager on + no user tls — auto-wires cluster-issuer annotation + tls block
    set:
      certManager.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: hearth-hearth-home-issuer
      - equal:
          path: spec.tls[0].hosts[0]
          value: hearth.example.com
      - equal:
          path: spec.tls[0].secretName
          value: hearth-hearth-home-api-tls

  - it: cert-manager on + existing Issuer of kind Issuer — uses issuer annotation
    set:
      certManager.enabled: true
      certManager.issuer.type: existing
      certManager.issuer.existing.name: my-existing-issuer
      certManager.issuer.existing.kind: Issuer
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/issuer"]
          value: my-existing-issuer
      - notExists:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]

  - it: cert-manager on + user-supplied tls — user-supplied wins, no auto-wire
    set:
      certManager.enabled: true
      api.ingress.tls:
        - hosts:
            - user-host.example.com
          secretName: user-supplied-tls
    asserts:
      - notExists:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
      - equal:
          path: spec.tls[0].secretName
          value: user-supplied-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: user-host.example.com
