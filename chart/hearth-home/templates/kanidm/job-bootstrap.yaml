{{- if .Values.capabilities.identity }}
{{- if .Values.kanidm.bootstrap.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hearth-home.fullname" . }}-kanidm-bootstrap
  labels:
    {{- include "hearth-home.componentLabels" (dict "context" . "component" "kanidm") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hearth-home.fullname" . }}-kanidm-bootstrap
  labels:
    {{- include "hearth-home.componentLabels" (dict "context" . "component" "kanidm") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
# H-002: pods/exec is gone. The Job no longer execs into the kanidm
# pod — the StatefulSet itself recovers admin credentials and hands
# them off via the <fullname>-kanidm-recovery Secret. The Job's
# secrets RBAC is restricted to the two specific Secrets it actually
# touches: read the recovery Secret, upsert the final credentials
# Secret. No wildcard resourceNames, no list/watch/delete.
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "hearth-home.fullname" . }}-kanidm-recovery
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "hearth-home.fullname" . }}-kanidm-credentials
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hearth-home.fullname" . }}-kanidm-bootstrap
  labels:
    {{- include "hearth-home.componentLabels" (dict "context" . "component" "kanidm") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ include "hearth-home.fullname" . }}-kanidm-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "hearth-home.fullname" . }}-kanidm-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hearth-home.fullname" . }}-kanidm-bootstrap
  labels:
    {{- include "hearth-home.componentLabels" (dict "context" . "component" "kanidm") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "hearth-home.selectorLabels" (dict "context" . "component" "kanidm") | nindent 8 }}
    spec:
      {{- include "hearth-home.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "hearth-home.fullname" . }}-kanidm-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: "{{ .Values.kanidm.bootstrap.image.repository }}:{{ .Values.kanidm.bootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.kanidm.bootstrap.image.pullPolicy }}
          securityContext:
            {{- include "hearth-home.restrictedSecurityContext" . | nindent 12 }}
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            # Credentials are sourced from the recovery Secret the
            # kanidm StatefulSet's publish-recovery init container
            # writes. Direct env-var mount means the Job doesn't need
            # RBAC to read the Secret — kubelet projects it.
            - name: ADMIN_PW
              valueFrom:
                secretKeyRef:
                  name: {{ include "hearth-home.fullname" . }}-kanidm-recovery
                  key: admin-password
            - name: IDM_ADMIN_PW
              valueFrom:
                secretKeyRef:
                  name: {{ include "hearth-home.fullname" . }}-kanidm-recovery
                  key: idm-admin-password
            - name: KANIDM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KANIDM_URL
              value: "https://{{ include "hearth-home.fullname" . }}-kanidm:{{ .Values.kanidm.service.port }}"
            - name: KANIDM_DOMAIN
              value: {{ .Values.kanidm.config.domain }}
            - name: KANIDM_SECRET_NAME
              value: {{ include "hearth-home.fullname" . }}-kanidm-credentials
            - name: API_INGRESS_URL
              value: {{ if .Values.api.ingress.enabled }}https://{{ (first .Values.api.ingress.hosts).host }}{{ else }}{{ include "hearth-home.apiUrl" . }}{{ end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: {{ include "hearth-home.fullname" . }}-kanidm-bootstrap
        # tmp is required because the alpine image's busybox sh + curl
        # need a writable scratch dir and the security context pins
        # readOnlyRootFilesystem.
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
