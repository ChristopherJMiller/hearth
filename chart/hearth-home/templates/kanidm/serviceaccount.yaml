{{- if and .Values.capabilities.identity .Values.kanidm.bootstrap.enabled }}
# ServiceAccount used by the kanidm StatefulSet pod for the in-pod
# credential-publisher init container (H-002). Scope is intentionally
# tiny: only the single recovery Secret is reachable, and only the
# verbs needed to upsert it (no list, no watch, no delete).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hearth-home.fullname" . }}-kanidm-server
  labels:
    {{- include "hearth-home.componentLabels" (dict "context" . "component" "kanidm") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hearth-home.fullname" . }}-kanidm-server
  labels:
    {{- include "hearth-home.componentLabels" (dict "context" . "component" "kanidm") | nindent 4 }}
rules:
  # `create` is unfortunately resource-name-blind in RBAC (resourceNames
  # only affects get/list/watch/update/patch/delete). We accept that the
  # SA can theoretically create *any* secret in the namespace — but in
  # practice all secrets it ever touches end up named here, because the
  # publisher script only ever PUTs / POSTs $RECOVERY_SECRET_NAME.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "hearth-home.fullname" . }}-kanidm-recovery
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hearth-home.fullname" . }}-kanidm-server
  labels:
    {{- include "hearth-home.componentLabels" (dict "context" . "component" "kanidm") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hearth-home.fullname" . }}-kanidm-server
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hearth-home.fullname" . }}-kanidm-server
{{- end }}
