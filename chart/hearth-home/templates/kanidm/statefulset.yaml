{{- if .Values.capabilities.identity }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hearth-home.fullname" . }}-kanidm
  labels:
    {{- include "hearth-home.componentLabels" (dict "context" . "component" "kanidm") | nindent 4 }}
spec:
  serviceName: {{ include "hearth-home.fullname" . }}-kanidm
  replicas: 1
  selector:
    matchLabels:
      {{- include "hearth-home.selectorLabels" (dict "context" . "component" "kanidm") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.kanidm.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hearth-home.selectorLabels" (dict "context" . "component" "kanidm") | nindent 8 }}
    spec:
      {{- include "hearth-home.imagePullSecrets" . | nindent 6 }}
      # The pod needs a SA token so the credential-publisher init
      # container can create the recovery Secret via the in-cluster
      # K8s API. Scope is tiny — see kanidm/serviceaccount.yaml.
      serviceAccountName: {{ include "hearth-home.fullname" . }}-kanidm-server
      automountServiceAccountToken: true
      {{- if .Values.kanidm.bootstrap.enabled }}
      # ------------------------------------------------------------------
      # H-002: in-pod credential recovery — replaces the previous
      # `kubectl exec kanidmd recover-account` flow. By moving the
      # privileged step into the StatefulSet itself, the kanidm-bootstrap
      # Job no longer needs `pods/exec` RBAC. Each init container runs
      # at most once per pod boot; the recover-credentials step skips
      # itself when the marker on the data PVC says the admin/idm_admin
      # passwords have already been seeded (so pod restarts don't
      # rotate them).
      # ------------------------------------------------------------------
      initContainers:
        - name: recover-credentials
          image: "{{ .Values.kanidm.image.repository }}:{{ .Values.kanidm.image.tag }}"
          imagePullPolicy: {{ .Values.kanidm.image.pullPolicy }}
          securityContext:
            {{- include "hearth-home.restrictedSecurityContext" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -eu
              marker=/data/db/.hearth-bootstrap-recovered
              if [ -f "$marker" ]; then
                echo "admin/idm_admin already recovered — skipping (delete $marker on the data PVC to force a re-seed)"
                # Make sure the recovery files don't carry stale content from
                # a previous boot — the publisher will detect the empty files
                # and skip publishing too.
                : > /recovery/admin.pw
                : > /recovery/idm_admin.pw
                exit 0
              fi
              admin_out=$(kanidmd recover-account admin --config /data/server.toml 2>&1)
              admin_pw=$(printf '%s' "$admin_out" | sed -n 's/.*new_password: *"\([^"]*\)".*/\1/p' | head -n1)
              idm_out=$(kanidmd recover-account idm_admin --config /data/server.toml 2>&1)
              idm_pw=$(printf '%s' "$idm_out" | sed -n 's/.*new_password: *"\([^"]*\)".*/\1/p' | head -n1)
              if [ -z "$admin_pw" ] || [ -z "$idm_pw" ]; then
                echo "ERROR: failed to parse recovered passwords" >&2
                printf '%s\n%s\n' "$admin_out" "$idm_out" >&2
                exit 1
              fi
              printf '%s' "$admin_pw" > /recovery/admin.pw
              printf '%s' "$idm_pw" > /recovery/idm_admin.pw
              chmod 0400 /recovery/admin.pw /recovery/idm_admin.pw
              touch "$marker"
              echo "admin + idm_admin passwords recovered and staged on tmpfs"
          volumeMounts:
            - name: config
              mountPath: /data/server.toml
              subPath: server.toml
              readOnly: true
            - name: tls
              mountPath: /data/cert.pem
              subPath: tls.crt
              readOnly: true
            - name: tls
              mountPath: /data/key.pem
              subPath: tls.key
              readOnly: true
            - name: data
              mountPath: /data/db
            - name: recovery
              mountPath: /recovery
        - name: publish-recovery
          image: "{{ .Values.kanidm.bootstrap.publisherImage.repository }}:{{ .Values.kanidm.bootstrap.publisherImage.tag }}"
          imagePullPolicy: {{ .Values.kanidm.bootstrap.publisherImage.pullPolicy }}
          securityContext:
            {{- include "hearth-home.restrictedSecurityContext" . | nindent 12 }}
          env:
            - name: RECOVERY_SECRET_NAME
              value: {{ include "hearth-home.fullname" . }}-kanidm-recovery
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - sh
            - -c
            - |
              set -eu
              if [ ! -s /recovery/admin.pw ] || [ ! -s /recovery/idm_admin.pw ]; then
                echo "no fresh recovery payload — recover-credentials skipped its work, leaving the existing Secret untouched"
                exit 0
              fi
              apk add --no-cache --quiet curl jq >/dev/null
              admin_b64=$(base64 -w0 < /recovery/admin.pw)
              idm_b64=$(base64 -w0 < /recovery/idm_admin.pw)
              token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              cacert=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              api=https://kubernetes.default.svc
              body=$(jq -n \
                --arg name "$RECOVERY_SECRET_NAME" \
                --arg ns "$NAMESPACE" \
                --arg admin "$admin_b64" \
                --arg idm "$idm_b64" \
                '{apiVersion:"v1",kind:"Secret",type:"Opaque",
                  metadata:{name:$name,namespace:$ns,labels:{"app.kubernetes.io/managed-by":"hearth-home"}},
                  data:{"admin-password":$admin,"idm-admin-password":$idm}}')
              # Try PUT first (idempotent update on subsequent boots);
              # fall through to POST when the Secret doesn't exist yet.
              if ! printf '%s' "$body" | curl -sf --cacert "$cacert" \
                  -H "Authorization: Bearer $token" \
                  -H "Content-Type: application/json" \
                  -X PUT "$api/api/v1/namespaces/$NAMESPACE/secrets/$RECOVERY_SECRET_NAME" \
                  -d @- >/dev/null; then
                printf '%s' "$body" | curl -sf --cacert "$cacert" \
                  -H "Authorization: Bearer $token" \
                  -H "Content-Type: application/json" \
                  -X POST "$api/api/v1/namespaces/$NAMESPACE/secrets" \
                  -d @- >/dev/null
              fi
              echo "published recovery secret $RECOVERY_SECRET_NAME"
          volumeMounts:
            - name: recovery
              mountPath: /recovery
              readOnly: true
      {{- end }}
      containers:
        - name: kanidm
          image: "{{ .Values.kanidm.image.repository }}:{{ .Values.kanidm.image.tag }}"
          imagePullPolicy: {{ .Values.kanidm.image.pullPolicy }}
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          resources:
            {{- toYaml .Values.kanidm.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /data/server.toml
              subPath: server.toml
              readOnly: true
            - name: tls
              mountPath: /data/cert.pem
              subPath: tls.crt
              readOnly: true
            - name: tls
              mountPath: /data/key.pem
              subPath: tls.key
              readOnly: true
            - name: data
              mountPath: /data/db
      volumes:
        - name: config
          configMap:
            name: {{ include "hearth-home.fullname" . }}-kanidm
        - name: tls
          secret:
            secretName: {{ if .Values.kanidm.tls.existingSecret }}{{ .Values.kanidm.tls.existingSecret }}{{ else }}{{ include "hearth-home.fullname" . }}-kanidm-tls{{ end }}
        {{- if .Values.kanidm.bootstrap.enabled }}
        - name: recovery
          emptyDir:
            medium: Memory
        {{- end }}
      {{- with .Values.kanidm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kanidm.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kanidm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.kanidm.persistence.size }}
{{- end }}
