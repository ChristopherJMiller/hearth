{{- if and .Values.certManager.enabled (ne .Values.certManager.issuer.type "existing") }}
{{- if eq .Values.certManager.issuer.type "selfSigned" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "hearth-home.fullname" . }}-issuer
  labels:
    {{- include "hearth-home.labels" . | nindent 4 }}
spec:
  selfSigned: {}
{{- else if eq .Values.certManager.issuer.type "ca" }}
# --- In-cluster CA pattern -------------------------------------------------
#
# Three resources work together:
#
#   1. <fullname>-bootstrap-issuer (selfSigned)  signs ↓
#   2. <fullname>-ca (Certificate, isCA: true)   stored in Secret
#      <fullname>-ca-key, then referenced by ↓
#   3. <fullname>-issuer (ClusterIssuer, ca)     signs every ingress cert
#
# Downstream (`certIssuerRef` helper, the ingress auto-wiring) always
# points at <fullname>-issuer, so consumers don't care which underlying
# issuer type produced it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "hearth-home.fullname" . }}-bootstrap-issuer
  labels:
    {{- include "hearth-home.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "hearth-home.fullname" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hearth-home.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ .Values.certManager.issuer.ca.commonName | quote }}
  secretName: {{ include "hearth-home.fullname" . }}-ca-key
  duration: {{ .Values.certManager.issuer.ca.duration }}
  renewBefore: {{ .Values.certManager.issuer.ca.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ include "hearth-home.fullname" . }}-bootstrap-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "hearth-home.fullname" . }}-issuer
  labels:
    {{- include "hearth-home.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "hearth-home.fullname" . }}-ca-key
{{- if .Values.certManager.issuer.ca.publishCaConfigMap }}
---
# Surface the CA cert in a ConfigMap so downstream tooling (fleet
# bootstrap, kube-system trust-manager, etc.) can mount it without
# needing read access to the Secret. cert-manager copies the CA bundle
# into a Secret first; we mirror via a one-shot Job because
# trust-manager isn't a dependency here.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hearth-home.fullname" . }}-ca-publish
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hearth-home.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "hearth-home.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "hearth-home.fullname" . }}-ca-publish
      containers:
        - name: publish
          image: bitnami/kubectl:1.30
          securityContext:
            {{- include "hearth-home.restrictedSecurityContext" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -eu
              # Wait for cert-manager to populate ca.crt in the Secret.
              for _ in $(seq 1 60); do
                if kubectl -n {{ .Release.Namespace }} get secret {{ include "hearth-home.fullname" . }}-ca-key -o jsonpath='{.data.ca\.crt}' | grep -q .; then
                  break
                fi
                sleep 2
              done
              CA=$(kubectl -n {{ .Release.Namespace }} get secret {{ include "hearth-home.fullname" . }}-ca-key -o jsonpath='{.data.ca\.crt}' | base64 -d)
              kubectl -n {{ .Release.Namespace }} create configmap {{ include "hearth-home.fullname" . }}-ca-cert \
                --from-literal=ca.crt="$CA" \
                --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hearth-home.fullname" . }}-ca-publish
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hearth-home.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hearth-home.fullname" . }}-ca-publish
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hearth-home.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ include "hearth-home.fullname" . }}-ca-key"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hearth-home.fullname" . }}-ca-publish
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hearth-home.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hearth-home.fullname" . }}-ca-publish
subjects:
  - kind: ServiceAccount
    name: {{ include "hearth-home.fullname" . }}-ca-publish
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- else if eq .Values.certManager.issuer.type "acme" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "hearth-home.fullname" . }}-issuer
  labels:
    {{- include "hearth-home.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.certManager.issuer.acme.server }}
    email: {{ required "certManager.issuer.acme.email is required when issuer.type=acme" .Values.certManager.issuer.acme.email }}
    privateKeySecretRef:
      name: {{ include "hearth-home.fullname" . }}-acme-key
    solvers:
      {{- if eq .Values.certManager.issuer.acme.solver "http01" }}
      - http01:
          ingress:
            class: {{ .Values.certManager.issuer.acme.ingressClass }}
      {{- else if eq .Values.certManager.issuer.acme.solver "dns01" }}
      - dns01:
          {{- toYaml .Values.certManager.issuer.acme.dns01 | nindent 12 }}
      {{- else }}
      {{- fail (printf "certManager.issuer.acme.solver must be 'http01' or 'dns01', got: %s" .Values.certManager.issuer.acme.solver) }}
      {{- end }}
{{- else }}
{{- fail (printf "certManager.issuer.type must be one of: selfSigned, ca, acme, existing. got: %s" .Values.certManager.issuer.type) }}
{{- end }}
{{- end }}
