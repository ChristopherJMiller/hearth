spec:
  podSelector:
    matchLabels:
      {{- include "hearth-home.selectorLabels" (dict "context" . "component" "attic") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerSelector.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerSelector.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.attic.service.port }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
