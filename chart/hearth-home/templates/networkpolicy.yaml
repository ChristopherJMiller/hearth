              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432

{{- if .Values.capabilities.identity }}
---
# ===========================================================================
# Kanidm: every component that does OIDC needs ingress to 8443
# ===========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hearth-home.fullname" . }}-kanidm
  labels:
    {{- include "hearth-home.componentLabels" (dict "context" . "component" "kanidm") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hearth-home.selectorLabels" (dict "context" . "component" "kanidm") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerSelector.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerSelector.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.kanidm.service.port }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.kanidm.service.port }}
  # Kanidm itself doesn't need to talk to other Hearth components for
  # OIDC — clients call into it. DNS egress is granted by the
  # default-allow DNS rule.
  egress: []
{{- end }}

