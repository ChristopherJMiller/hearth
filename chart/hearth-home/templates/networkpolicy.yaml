---
# ===========================================================================
# oauth2-proxy: HTTP/HTTPS ingress + upstream egress to API/Synapse/etc.
# ===========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hearth-home.fullname" . }}-oauth2-proxy
  labels:
    {{- include "hearth-home.componentLabels" (dict "context" . "component" "oauth2-proxy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hearth-home.selectorLabels" (dict "context" . "component" "oauth2-proxy") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerSelector.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerSelector.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.oauth2Proxy.service.port }}
  egress:
    # Reach the API + every upstream the proxy fronts.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    {{- if .Values.capabilities.identity }}
    # OIDC issuer (Kanidm).
    - to:
        - podSelector:
            matchLabels:
              {{- include "hearth-home.selectorLabels" (dict "context" . "component" "kanidm") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.kanidm.service.port }}
    {{- end }}

