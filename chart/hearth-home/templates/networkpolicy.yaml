{{- if .Values.networkPolicy.enabled }}
# ===========================================================================
# Default-deny NetworkPolicy
# ===========================================================================
#
# Selects every pod in the release namespace and denies all ingress/egress
# by default. Subsequent NPs in this file punch the necessary holes per
# capability. Without this, a compromise in (say) Nextcloud could reach
# Postgres / Kanidm / Headscale unimpeded — that's the hardening gap
# H-003 closes.
#
# DNS egress is allowed up-front via the dedicated `*-dns-egress` policy
# below — without it, every workload's lookup of `<release>-postgresql`,
# `<release>-kanidm`, etc. would NXDOMAIN.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hearth-home.fullname" . }}-default-deny
  labels:
    {{- include "hearth-home.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
{{- if .Values.networkPolicy.allowDnsEgress }}
# Permit DNS to kube-dns (UDP/TCP 53) from every workload.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hearth-home.fullname" . }}-allow-dns
  labels:
    {{- include "hearth-home.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
{{- end }}
{{- with .Values.networkPolicy.extraEgressCidrs }}
# Operator-supplied egress allowlist (e.g. external API the chart calls).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hearth-home.fullname" $ }}-extra-egress
  labels:
    {{- include "hearth-home.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
{{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
---
{{- end }}

# ===========================================================================
# hearth-api: ingress from the ingress controller (always-enabled component)
# ===========================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hearth-home.fullname" . }}-api
  labels:
    {{- include "hearth-home.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hearth-home.selectorLabels" (dict "context" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress controller (browser traffic via the public ingress).
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerSelector.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressControllerSelector.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.port }}
    # Sibling components in the same release (oauth2-proxy upstream,
    # other workloads that hit the API directly inside the cluster).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.port }}
  egress:
    # Postgres.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 5432
    {{- if .Values.capabilities.identity }}
    # Kanidm: OIDC discovery + JWKS for user JWT validation.
    - to:
        - podSelector:
            matchLabels:
              {{- include "hearth-home.selectorLabels" (dict "context" . "component" "kanidm") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.kanidm.service.port }}
    {{- end }}
    {{- if .Values.capabilities.mesh }}
    # Headscale API (optional — only when the API talks to mesh).
    - to:
        - podSelector:
            matchLabels:
              {{- include "hearth-home.selectorLabels" (dict "context" . "component" "headscale") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.headscale.service.port }}
    {{- end }}
---
