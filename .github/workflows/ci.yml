name: CI

# Coverage map — what runs where:
#
#   check (nix flake check):
#     - All VM tests under tests/*.nix (vm-full-login-flow,
#       vm-libreoffice-extension, vm-agent-heartbeat, vm-kanidm-auth,
#       vm-headscale-mesh, vm-full-enrollment, vm-disko-provision,
#       vm-agent-config-roundtrip, vm-offline-fallback,
#       vm-agent-polling, vm-agent-system-switch, vm-desktop-baseline)
#     - workspaceClippy, workspaceFmt, workspaceTests, helmChartLint
#
#   cargo-lint (nix develop --command):
#     - cargo fmt --check (workspace-wide)
#     - cargo clippy --workspace --deny warnings
#     - cargo test --workspace
#       Includes the rust_uno path dep (the devShell shellHook
#       symlinks ${rust-uno} → $PWD/rust_uno; doctests are disabled
#       on rust_uno via nix/rust-uno/default.nix so this step stays
#       green even though the vendored crate has stale `use` paths in
#       its `///` examples).
#
#   cargo-integration (postgres service):
#     - cargo test --workspace -- --ignored
#       Picks up everything #[ignore]'d behind DATABASE_URL — the
#       /api/v1/* HTTP route tests under crates/hearth-api/tests/api/.
#       Non-DB integration tests (tests/api/fleet_config.rs) run in
#       cargo-lint above.
#
#   web-check:
#     - pnpm install --frozen-lockfile, tsc --build for @hearth/ui,
#       pnpm typecheck + build for @hearth/web.
#
# The Helm chart has its own workflow (.github/workflows/helm.yml):
# helm lint --strict, helm-unittest, kubeconform, and a kind-cluster
# install smoke test via ct.
#
# When adding a new test target, decide which job runs it and update
# this map.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nix flake check
        run: nix flake check

  cargo-lint:
    name: Cargo Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: cargo fmt
        run: nix develop --command cargo fmt --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --workspace -- --deny warnings

      - name: cargo test (unit)
        run: nix develop --command cargo test --workspace

  cargo-integration:
    name: Cargo Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hearth
          POSTGRES_PASSWORD: hearth
          POSTGRES_DB: hearth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hearth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://hearth:hearth@localhost:5432/hearth
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: cargo test (integration)
        run: nix develop --command cargo test --workspace -- --ignored

  web-check:
    name: Web Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: pnpm install
        run: nix develop --command bash -c "cd web && pnpm install --frozen-lockfile"

      - name: build ui types
        run: nix develop --command bash -c "cd web && pnpm --filter @hearth/ui build"

      - name: typecheck
        run: nix develop --command bash -c "cd web && pnpm typecheck"

      - name: build
        run: nix develop --command bash -c "cd web && pnpm build"
